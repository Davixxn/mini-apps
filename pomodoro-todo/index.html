<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포모도로 할일</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --text:#e8e9ed; --muted:#8b8f9a;
    --accent:#ff6b5e; --accent2:#5ec2ff; --good:#4ade80; --border:#2a2e38;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:420px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:28px 24px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  h1{font-size:15px; font-weight:600; letter-spacing:.5px; color:var(--muted); text-align:center; margin:0 0 18px; text-transform:uppercase;}
  .modes{display:flex; gap:8px; justify-content:center; margin-bottom:22px;}
  .modes button{
    flex:1; padding:9px 0; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--muted); font-size:13px; cursor:pointer; transition:.15s;
  }
  .modes button.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .timer{
    font-size:64px; font-weight:700; text-align:center; letter-spacing:2px;
    font-variant-numeric:tabular-nums; margin:8px 0 6px;
  }
  .sessions{text-align:center; color:var(--muted); font-size:12px; margin-bottom:20px;}
  .controls{display:flex; gap:10px; justify-content:center; margin-bottom:26px;}
  .controls button{
    padding:11px 22px; border-radius:12px; border:none; font-size:14px; font-weight:600; cursor:pointer;
  }
  #startBtn{background:var(--accent); color:#fff;}
  #resetBtn{background:var(--panel2); color:var(--text); border:1px solid var(--border) !important;}
  hr{border:none; border-top:1px solid var(--border); margin:0 0 18px;}
  .todo-input{display:flex; gap:8px; margin-bottom:14px;}
  .todo-input input{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:14px; outline:none;
  }
  .todo-input input:focus{border-color:var(--accent2);}
  .todo-input button{
    padding:0 16px; border-radius:10px; border:none; background:var(--accent2); color:#0f1115; font-weight:700; cursor:pointer;
  }
  ul{list-style:none; margin:0; padding:0; max-height:220px; overflow-y:auto;}
  li{
    display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:14px;
  }
  li:last-child{border-bottom:none;}
  li.done span{color:var(--muted); text-decoration:line-through;}
  li .check{
    width:18px; height:18px; border-radius:6px; border:2px solid var(--border); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  li.done .check{background:var(--good); border-color:var(--good); color:#0f1115;}
  li span{flex:1; word-break:break-word;}
  li .del{color:var(--muted); cursor:pointer; font-size:16px; padding:0 4px;}
  li .del:hover{color:var(--accent);}
  .empty{color:var(--muted); font-size:13px; text-align:center; padding:14px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Focus Timer</h1>
    <div class="modes">
      <button class="active" data-min="25" data-label="집중">집중 25</button>
      <button data-min="5" data-label="짧은 휴식">휴식 5</button>
      <button data-min="15" data-label="긴 휴식">긴 휴식 15</button>
    </div>
    <div class="timer" id="timer">25:00</div>
    <div class="sessions" id="sessions">완료한 집중 세션: 0</div>
    <div class="controls">
      <button id="startBtn">시작</button>
      <button id="resetBtn">리셋</button>
    </div>
    <hr>
    <div class="todo-input">
      <input id="todoInput" type="text" placeholder="할 일을 입력하고 Enter" maxlength="120">
      <button id="addBtn">추가</button>
    </div>
    <ul id="todoList"></ul>
  </div>
</div>
<script>
(function(){
  const timerEl = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const sessionsEl = document.getElementById('sessions');
  const modeBtns = document.querySelectorAll('.modes button');

  let totalSeconds = 25*60;
  let remaining = totalSeconds;
  let running = false;
  let intervalId = null;
  let sessions = Number(localStorage.getItem('pomo_sessions') || 0);
  sessionsEl.textContent = `완료한 집중 세션: ${sessions}`;

  function render(){
    const m = String(Math.floor(remaining/60)).padStart(2,'0');
    const s = String(remaining%60).padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
    document.title = running ? `${m}:${s} - Focus Timer` : 'Focus Timer';
  }

  function tick(){
    if(remaining <= 0){
      clearInterval(intervalId);
      running = false;
      startBtn.textContent = '시작';
      const activeBtn = document.querySelector('.modes button.active');
      if(activeBtn.dataset.min === '25'){
        sessions++;
        localStorage.setItem('pomo_sessions', sessions);
        sessionsEl.textContent = `완료한 집중 세션: ${sessions}`;
      }
      try{ new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=').play(); }catch(e){}
      alert('시간 종료!');
      return;
    }
    remaining--;
    render();
  }

  startBtn.addEventListener('click', ()=>{
    if(running){
      clearInterval(intervalId);
      running = false;
      startBtn.textContent = '시작';
    } else {
      running = true;
      startBtn.textContent = '일시정지';
      intervalId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', ()=>{
    clearInterval(intervalId);
    running = false;
    startBtn.textContent = '시작';
    remaining = totalSeconds;
    render();
  });

  modeBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modeBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      clearInterval(intervalId);
      running = false;
      startBtn.textContent = '시작';
      totalSeconds = Number(btn.dataset.min) * 60;
      remaining = totalSeconds;
      render();
    });
  });

  render();

  // Todo list
  const todoInput = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const todoList = document.getElementById('todoList');
  let todos = JSON.parse(localStorage.getItem('pomo_todos') || '[]');

  function saveTodos(){
    localStorage.setItem('pomo_todos', JSON.stringify(todos));
  }

  function renderTodos(){
    todoList.innerHTML = '';
    if(todos.length === 0){
      todoList.innerHTML = '<div class="empty">할 일이 없습니다. 추가해보세요.</div>';
      return;
    }
    todos.forEach((t, i)=>{
      const li = document.createElement('li');
      if(t.done) li.classList.add('done');
      li.innerHTML = `<div class="check">${t.done ? '✓' : ''}</div><span></span><div class="del">×</div>`;
      li.querySelector('span').textContent = t.text;
      li.querySelector('.check').addEventListener('click', ()=>{
        todos[i].done = !todos[i].done;
        saveTodos(); renderTodos();
      });
      li.querySelector('.del').addEventListener('click', ()=>{
        todos.splice(i,1);
        saveTodos(); renderTodos();
      });
      todoList.appendChild(li);
    });
  }

  function addTodo(){
    const val = todoInput.value.trim();
    if(!val) return;
    todos.push({text: val, done:false});
    todoInput.value = '';
    saveTodos(); renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e=>{ if(e.key === 'Enter') addTodo(); });

  renderTodos();
})();
</script>
</body>
</html>
